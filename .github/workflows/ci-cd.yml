# =============================================================================
#  CI/CD: build the paper PDF and the arXiv package on a self-hosted runner.
#
#  Runner requirements: Linux, TeX Live + latexmk + make already installed
#  (see README.md, "Setting Up Ubuntu"). arxiv_latex_cleaner is optional.
#
#  Triggers:
#    push / pull_request  -> build PDF + arXiv package, upload as artifacts
#    tag v*  (e.g. v1.0)  -> additionally require no \TODO markers and
#                            publish a GitHub Release with PDF + tar.gz
#    PR merged into main  -> deploy_wiki: publish the article text and the
#                            PDF download link on the Wiki "Home" page
#                            (direct pushes to main, other branches, tags
#                            and manual runs do NOT touch the wiki)
#    workflow_dispatch    -> manual run from the Actions tab
# =============================================================================
name: ci-cd

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["README.md", ".vscode/**"]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch cancels the running build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build PDF and arXiv package
    # Security: never run code from forked PRs on a self-hosted machine.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          clean: true

      - name: Check toolchain
        if: steps.pr.outputs.merged == 'true'
        run: |
          set -euo pipefail
          for t in pdflatex bibtex latexmk make; do
            command -v "$t" >/dev/null || { echo "::error::$t not found on runner"; exit 1; }
          done
          pdflatex --version | head -1
          latexmk --version | head -2 | tail -1
          if command -v arxiv_latex_cleaner >/dev/null; then
            echo "arxiv_latex_cleaner: available"
          else
            echo "::notice::arxiv_latex_cleaner not installed - comments will stay in the arXiv package"
          fi

      # The runner workspace persists between jobs - start from a clean state.
      - name: Clean previous build
        run: make distclean

      - name: Build PDF
        run: make pdf

      - name: Check LaTeX log
        run: |
          set -uo pipefail
          log=build/main.log
          undef=$(grep -cE "(Citation|Reference) .* undefined" "$log" || true)
          overfull=$(grep -c "^Overfull" "$log" || true)
          todos=$(grep -rho '\\TODO{' main.tex sections tables | wc -l)
          echo "Undefined refs/citations: $undef"
          echo "Overfull boxes:           $overfull"
          echo "TODO markers:             $todos"
          [ "$undef" -eq 0 ] || echo "::warning::$undef undefined references/citations (see build/main.log)"
          {
            echo "### Build summary"
            echo "| Check | Count |"
            echo "|---|---|"
            echo "| Pages | $(pdfinfo build/main.pdf 2>/dev/null | awk '/^Pages/{print $2}') |"
            echo "| Undefined refs/citations | $undef |"
            echo "| Overfull boxes | $overfull |"
            echo '| `\TODO` markers | '"$todos"' |'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build arXiv package
        run: |
          set -euo pipefail
          make arxiv
          # `make arxiv-check` only prints a message; fail CI explicitly here.
          test -s build/arxiv_test/main.pdf || {
            echo "::error::arXiv package does not compile, see build/arxiv_test/main.log"
            exit 1
          }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-${{ github.sha }}
          path: |
            build/main.pdf
            build/main.log
            arxiv_submission.tar.gz
          if-no-files-found: warn
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, Linux]
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require final text (no TODO / placeholders)
        run: |
          set -uo pipefail
          left=$(grep -rnE '\\(TODO|NUM|CITE)\b' main.tex sections tables || true)
          if [ -n "$left" ]; then
            echo "::error::Release tags require a final text. Remaining markers:"
            echo "$left" | head -50
            exit 1
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: paper-${{ github.sha }}
          path: dist

      - name: Rename release files
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          mv dist/build/main.pdf          "dist/asic_slam_${tag}.pdf"
          mv dist/arxiv_submission.tar.gz "dist/asic_slam_${tag}_arxiv.tar.gz"
          ls -l dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/asic_slam_${{ github.ref_name }}.pdf
            dist/asic_slam_${{ github.ref_name }}_arxiv.tar.gz
          generate_release_notes: true

  # ---------------------------------------------------------------------------
  #  Wiki: Home.md = PDF download link + full article text (LaTeX -> Markdown
  #  via pandoc), PDF and rendered figures stored in the wiki repository.
  #  One-time setup: open the "Wiki" tab and create any first page - the
  #  <repo>.wiki.git repository does not exist until then.
  #  Push uses GITHUB_TOKEN; if your org blocks that, add a fine-grained PAT
  #  with "Contents: read/write" as the secret WIKI_TOKEN.
  # ---------------------------------------------------------------------------
  deploy_wiki:
    name: Deploy article to Wiki
    needs: build
    # Only the push that a merged PR creates on main. The PR's own runs
    # (pull_request event) build the PDF but must not publish unmerged text.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
    # Wiki is a single shared repo: never push from two runs at once.
    concurrency:
      group: ${{ github.workflow }}-wiki
      cancel-in-progress: false
    env:
      PANDOC_VERSION: "3.5"
      WIKI_PDF_NAME: asic_slam.pdf
      WIKI_BASE_URL: ${{ github.server_url }}/${{ github.repository }}/wiki
    defaults:
      run:
        shell: bash

    steps:
      # A push to main is not necessarily a PR merge (direct push by an admin,
      # bypassed protection). Ask the API whether this commit belongs to a PR
      # merged into main (works for merge, squash and rebase merges).
      - name: Require merged PR into main
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          json=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls")
          pr=$(python3 -c '
          import json, sys
          prs = [p for p in json.load(sys.stdin)
                 if p.get("merged_at") and p["base"]["ref"] == "main"]
          print(prs[0]["number"] if prs else "")
          ' <<<"$json")
          if [ -n "$pr" ]; then
            echo "Commit ${GITHUB_SHA::7} comes from merged PR #$pr"
            echo "merged=true" >> "$GITHUB_OUTPUT"
            echo "number=$pr"  >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${GITHUB_SHA::7} was pushed to main without a PR - wiki is not updated"
            echo "merged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.pr.outputs.merged == 'true'
        uses: actions/checkout@v4.2.2
        with:
          clean: true

      - name: Download artifacts
        if: steps.pr.outputs.merged == 'true'
        uses: actions/download-artifact@v4
        with:
          name: paper-${{ github.sha }}
          path: dist

      # pandoc >= 3.1 is needed (citeproc, Figure blocks). Use the system one
      # if it is recent enough, otherwise cache a static build on the runner.
      - name: Set up pandoc
        if: steps.pr.outputs.merged == 'true'
        run: |
          set -euo pipefail
          if command -v pandoc >/dev/null &&
             printf '3.1\n%s\n' "$(pandoc --version | awk 'NR==1{print $2}')" | sort -V -C; then
            echo "Using system $(pandoc --version | head -1)"
            exit 0
          fi
          case "$(uname -m)" in
            x86_64)  arch=amd64 ;;
            aarch64) arch=arm64 ;;
            *) echo "::error::unsupported arch $(uname -m) - install pandoc >= 3.1 manually"; exit 1 ;;
          esac
          dir="${RUNNER_TOOL_CACHE:-$HOME/.cache}/pandoc-${PANDOC_VERSION}"
          if [ ! -x "$dir/bin/pandoc" ]; then
            mkdir -p "$dir"
            curl -fsSL "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-${arch}.tar.gz" \
              | tar -xz -C "$dir" --strip-components=1
          fi
          echo "$dir/bin" >> "$GITHUB_PATH"
          "$dir/bin/pandoc" --version | head -1

      - name: Check toolchain
        if: steps.pr.outputs.merged == 'true'
        run: |
          set -euo pipefail
          for t in pandoc python3 pdflatex pdftocairo git; do
            command -v "$t" >/dev/null || { echo "::error::$t not found on runner"; exit 1; }
          done

      - name: Build wiki page
        if: steps.pr.outputs.merged == 'true'
        run: bash scripts/wiki/build.sh build/wiki dist/build/main.pdf

      - name: Publish to wiki
        if: steps.pr.outputs.merged == 'true'
        env:
          TOKEN: ${{ secrets.WIKI_TOKEN || secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          url="${{ github.server_url }}/${{ github.repository }}.wiki.git"
          rm -rf build/wiki_repo
          git -c http.extraheader="$auth" clone --depth 1 "$url" build/wiki_repo || {
            echo "::error::Cannot clone $url. Enable the Wiki and create the first page once in the GitHub UI (Wiki tab -> Create the first page)."
            exit 1
          }
          cd build/wiki_repo
          # only Home.md and assets/ are managed by CI; other wiki pages are kept
          rm -rf assets
          cp -r ../wiki/. .
          git add -A
          if git diff --cached --quiet; then
            echo "Wiki is up to date"
          else
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -q -m "Update paper: PR #${PR_NUMBER} (${GITHUB_SHA::7})"
            for i in 1 2 3; do
              git -c http.extraheader="$auth" push origin HEAD && break
              [ "$i" = 3 ] && { echo "::error::push to wiki failed"; exit 1; }
              git -c http.extraheader="$auth" pull --rebase --depth 1 origin HEAD
            done
          fi
          {
            echo "### Wiki (PR #${PR_NUMBER})"
            echo "- Page: ${WIKI_BASE_URL}"
            echo "- PDF: ${WIKI_BASE_URL}/assets/${WIKI_PDF_NAME}"
          } >> "$GITHUB_STEP_SUMMARY"
