name: Auto CI-CD Pipeline

# 1. Choose what actions trigger the automation
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # 2. Continuous Integration (Build & Test)
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository code
      uses: actions/checkout@v4
    - name: Test piplines
      run: ls -al